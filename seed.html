<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NŌVA — Firebase Data Seeder</title>
  <style>
    :root {
      --gold:    #e8a020;
      --green:   #10b981;
      --red:     #ef4444;
      --blue:    #0ea5e9;
      --bg:      #08080a;
      --surface: #111114;
      --card:    #18181c;
      --border:  rgba(255,255,255,0.07);
      --text:    #f0ede8;
      --muted:   #6b6560;
      --font:    'Inter', system-ui, sans-serif;
    }
    [data-theme="light"] {
      --bg: #f5f2ed; --surface: #fff; --card: #fff;
      --border: rgba(0,0,0,0.08); --text: #1a1714; --muted: #9a9490;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--text);
           min-height: 100vh; padding: 32px 16px; -webkit-font-smoothing: antialiased; }

    .page-header { text-align: center; margin-bottom: 40px; }
    .logo { font-size: 2rem; font-weight: 800; letter-spacing: 0.05em;
            background: linear-gradient(135deg, var(--gold), #f5be52);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .subtitle { color: var(--muted); margin-top: 6px; font-size: 0.9rem; }

    .container { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

    .card { background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; overflow: hidden; }
    .card-header { display: flex; align-items: center; justify-content: space-between;
                   padding: 16px 20px; border-bottom: 1px solid var(--border); }
    .card-title { font-weight: 700; font-size: 0.95rem; display: flex; align-items: center; gap: 10px; }
    .card-icon { width: 32px; height: 32px; border-radius: 8px;
                 display: flex; align-items: center; justify-content: center; font-size: 1rem; }
    .icon-gold   { background: rgba(232,160,32,0.15); }
    .icon-green  { background: rgba(16,185,129,0.15); }
    .icon-blue   { background: rgba(14,165,233,0.15); }
    .icon-purple { background: rgba(139,92,246,0.15); }
    .card-count { font-size: 0.75rem; color: var(--muted);
                  background: var(--surface); border: 1px solid var(--border);
                  padding: 3px 10px; border-radius: 99px; }
    .card-body { padding: 16px 20px; }

    /* Item list */
    .item-list { display: flex; flex-direction: column; gap: 8px; }
    .item-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px;
                background: var(--surface); border: 1px solid var(--border);
                border-radius: 10px; font-size: 0.83rem; }
    .item-row .item-num { width: 22px; height: 22px; border-radius: 6px;
                          background: var(--card); font-size: 0.7rem; font-weight: 700;
                          display: flex; align-items: center; justify-content: center;
                          color: var(--muted); flex-shrink: 0; }
    .item-row .item-name { flex: 1; font-weight: 600; }
    .item-row .item-meta { color: var(--muted); font-size: 0.75rem; }
    .item-row .item-badge { font-size: 0.68rem; font-weight: 700; padding: 2px 7px;
                             border-radius: 99px; }
    .badge-gold   { background: rgba(232,160,32,0.15); color: var(--gold); }
    .badge-green  { background: rgba(16,185,129,0.15); color: var(--green); }
    .badge-blue   { background: rgba(14,165,233,0.15); color: var(--blue); }
    .badge-red    { background: rgba(239,68,68,0.15);  color: var(--red); }
    .badge-purple { background: rgba(139,92,246,0.15); color: #8b5cf6; }

    /* Action bar */
    .action-bar { display: flex; gap: 12px; flex-wrap: wrap;
                  padding: 20px; border-top: 1px solid var(--border); }
    .btn { display: inline-flex; align-items: center; gap: 8px;
           padding: 11px 22px; border-radius: 10px; font-size: 0.85rem;
           font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; font-family: var(--font); }
    .btn-primary { background: var(--gold); color: #000; }
    .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-primary:active { transform: none; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-ghost { background: transparent; color: var(--muted);
                 border: 1px solid var(--border); }
    .btn-ghost:hover { border-color: var(--gold); color: var(--text); }
    .btn-danger { background: rgba(239,68,68,0.12); color: var(--red);
                  border: 1px solid rgba(239,68,68,0.2); }
    .btn-danger:hover { background: rgba(239,68,68,0.2); }

    /* Master seed button */
    .seed-all-wrap { text-align: center; margin-bottom: 8px; }
    .btn-seed-all { font-size: 1rem; padding: 14px 36px; border-radius: 12px;
                    background: linear-gradient(135deg, var(--gold), #f5be52);
                    color: #000; font-weight: 800; border: none; cursor: pointer;
                    transition: all 0.2s; font-family: var(--font);
                    box-shadow: 0 8px 24px rgba(232,160,32,0.3); }
    .btn-seed-all:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(232,160,32,0.4); }
    .btn-seed-all:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Log panel */
    #logPanel { background: #05050a; border: 1px solid var(--border);
                border-radius: 14px; padding: 16px 20px; font-family: 'Courier New', monospace;
                font-size: 0.78rem; line-height: 1.8; max-height: 260px;
                overflow-y: auto; display: none; }
    #logPanel.visible { display: block; }
    .log-ok   { color: var(--green); }
    .log-err  { color: var(--red); }
    .log-info { color: var(--blue); }
    .log-head { color: var(--gold); font-weight: 700; }

    /* Status badges per collection */
    .status-dot { width: 8px; height: 8px; border-radius: 50%;
                  background: var(--border); display: inline-block; margin-right: 6px; }
    .status-dot.seeded { background: var(--green); }
    .status-dot.error  { background: var(--red); }
    .status-dot.seeding { background: var(--gold); animation: pulse 0.8s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .progress-bar { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: 14px; }
    .progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), #f5be52);
                     border-radius: 2px; transition: width 0.4s ease; }

    .theme-toggle { position: fixed; top: 16px; right: 16px;
                    background: var(--card); border: 1px solid var(--border);
                    border-radius: 8px; padding: 8px 12px; cursor: pointer;
                    font-size: 0.8rem; color: var(--muted); font-family: var(--font); }
  </style>
</head>

/* ── Helpers ──────────────────────────────────────────────── */
function log(msg, type = 'info') {
  const panel = document.getElementById('logPanel');
  panel.classList.add('visible');
  const cls = { ok: 'log-ok', err: 'log-err', info: 'log-info', head: 'log-head' }[type] || 'log-info';
  panel.innerHTML += `<div class="${cls}">${msg}</div>`;
  panel.scrollTop = panel.scrollHeight;
}

function setDot(name, state) {
  const el = document.getElementById(`dot-${name}`);
  if (el) { el.className = `status-dot ${state}`; }
}

function setProgress(pct) {
  document.getElementById('progressFill').style.width = pct + '%';
}

/* ── Seed one collection ──────────────────────────────────── */
async function seedCollection(name) {
  const items = SEED[name];
  if (!items) { log(`Unknown collection: ${name}`, 'err'); return; }

  setDot(name, 'seeding');
  log(`\n▶ Seeding "${name}" (${items.length} docs)...`, 'head');

  // ── 1. Write to localStorage immediately (instant, always works) ──
  try {
    localStorage.setItem(`nova_${name}`, JSON.stringify(items));
    log(`  ✓ Saved to localStorage (nova_${name})`, 'ok');
  } catch (e) {
    log(`  ✗ localStorage failed: ${e.message}`, 'err');
  }

  // ── 2. Also push to Firebase Firestore ────────────────────────────
  let ok = 0, fail = 0;
  for (const item of items) {
    try {
      const { id, ...data } = item;
      await setDoc(doc(db, name, id), data);
      log(`  ✓ Firebase: ${id} — ${item.name || item.title || `Table ${item.number}` || item.id}`, 'ok');
      ok++;
    } catch (e) {
      log(`  ✗ Firebase: ${item.id}: ${e.message}`, 'err');
      fail++;
    }
  }

  setDot(name, fail > 0 && ok === 0 ? 'error' : 'seeded');
  log(`  Firebase: ${ok} written, ${fail} failed.`, fail > 0 ? 'err' : 'ok');
}

/* ── Seed all ─────────────────────────────────────────────── */
window.seedAll = async function() {
  const btn = document.getElementById('btnSeedAll');
  btn.disabled = true;
  btn.textContent = '⏳  Seeding…';
  document.getElementById('logPanel').innerHTML = '';

  const collections = ['foods', 'tables', 'staff', 'notifications'];
  for (let i = 0; i < collections.length; i++) {
    await seedCollection(collections[i]);
    setProgress(((i + 1) / collections.length) * 100);
  }

  btn.textContent = '✅  All collections seeded!';
  log('\n🎉 All done! Your Firebase is ready.', 'head');
};

/* ── Seed individual (exposed to onclick) ─────────────────── */
window.seedCollection = seedCollection;

/* ── Clear a collection ───────────────────────────────────── */
window.clearCollection = async function(name) {
  if (!confirm(`Delete ALL documents in "${name}"? This cannot be undone.`)) return;
  log(`\n🗑 Clearing "${name}"...`, 'head');
  try {
    const snap = await getDocs(collection(db, name));
    for (const d of snap.docs) {
      await deleteDoc(d.ref);
      log(`  ✓ Deleted ${d.id}`, 'ok');
    }
    setDot(name, '');
    log(`  "${name}" cleared.`, 'ok');
  } catch (e) {
    log(`  Error: ${e.message}`, 'err');
  }
};

/* ── Boot ─────────────────────────────────────────────────── */
renderPreviews();
log('Firebase initialized. Click "Seed All" to populate your database.', 'info');

</script>

<script>
function toggleTheme() {
  const h = document.documentElement;
  h.dataset.theme = h.dataset.theme === 'light' ? 'dark' : 'light';
}
</script>
